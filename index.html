<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>Question Bank — EC, SE &amp; CC revision</title>
<base href="./">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Offline multiple-choice revision for HSC Enterprise Computing and Software Engineering, and ISC2 Certified in Cybersecurity.">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Question Bank">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#/" aria-label="Home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Question Bank</span>
  </a>
  <div class="topbar-actions">
    <span class="session-score" id="session-score" hidden></span>
    <span class="net-status" id="net-status" role="status" hidden></span>
    <button type="button" id="install-btn" class="btn btn-quiet install-btn" hidden>Install</button>
    <button type="button" id="theme-toggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">
      <span aria-hidden="true" id="theme-icon">◐</span>
    </button>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="screen" class="screen">
    <p class="loading">Loading question banks…</p>
  </div>
</main>

<p class="announcer" role="status" aria-live="polite" id="announcer"></p>

<div class="toast-host" id="toast-host"></div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/pwa.js"></script>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
